[pytest]
testpaths = tests
addopts = -ra --tb=short
markers =
    tid(id, prio): идентификатор теста из docs/TEST_PLAN.md и приоритет (P0/P1/P2)
    design: расхождение может быть решением автора — результат помечается «уточнить у Евгения»
    long: длинный прогон (минуты); включается флагом --long
    unit: не требует устройства

; Canonical build for ESPidi-rebuilt. Arduino IDE remains a fallback only.
[platformio]
src_dir = Firmware/ESPidi   ; keep Evgeny's layout so diffs vs upstream stay clean
default_envs = esp32-c3     ; `pio run` builds only the unmodified baseline

[env:esp32-c3]
platform = espressif32@6.13.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    fortyseveneffects/MIDI Library@5.0.2
    adafruit/Adafruit SSD1306@2.5.17
    adafruit/Adafruit GFX Library@1.12.6
    adafruit/Adafruit BusIO@1.17.4
; MIDI runs on Serial1 (UART). Uncomment only if USB Serial debug doesn't appear:
; build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1

; Test build: same firmware + USB control console and timing metrics (see tools/README.md).
; ESPIDI_TEST is applied to project sources only (not to the framework/libraries).
[env:test]
extends = env:esp32-c3
build_flags = -DARDUINO_USB_MODE=1 -DARDUINO_USB_CDC_ON_BOOT=1
build_src_flags = -DESPIDI_TEST -include test_hooks.h
